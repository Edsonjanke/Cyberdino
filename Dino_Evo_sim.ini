[EMC]
VERSION = 1.1
MACHINE = Dino Evo Probe Basic (SIM)
DEBUG = 0

[DISPLAY]
# Tela cheia: o monitor da maquina e 1920x1080 e a interface e desenhada para
# essa resolucao. Sem isso a janela abre menor e a aba GERAR PGM fica espremida
# (os campos sobre a imagem escalam com o tamanho do painel, entao a fonte
# encolhe junto). Vale para o sim e para a maquina — mesmos valores nos dois.
DISPLAY = probe_basic_lathe --fullscreen true
BACK_TOOL_LATHE = 1
MASTER_TOOL_OFFSET_MODE = false
CONFIRM_EXIT = False
LOG_FILE = sim.log
LOG_LEVEL = INFO
PREFERENCE_FILE = sim.pref
CONFIG_FILE = custom_config.yml
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
DEFAULT_LINEAR_VELOCITY = 6.000000
MAX_LINEAR_VELOCITY = 75.000000
MIN_LINEAR_VELOCITY = 0.500000
DEFAULT_ANGULAR_VELOCITY = 12.000000
MAX_ANGULAR_VELOCITY = 180.000000
MIN_ANGULAR_VELOCITY = 1.666667
DEFAULT_SPINDLE_SPEED = 300
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.100000
MAX_FEED_OVERRIDE = 2.000000
PROGRAM_PREFIX = /home/evo/linuxcnc/nc_files
OPEN_FILE = /home/evo/linuxcnc/nc_files/pb_examples/blank.ngc
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 3
INCREMENTS = 1mm .1mm .05mm .01mm
USER_BUTTONS_PATH = user_buttons/
USER_TABS_PATH = user_tabs/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XZ
GEOMETRY = XZ
OFFSET_COLUMNS = XZ
TOOL_TABLE_COLUMNS = TXZIJDQR
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true
LATHE = 1
EDITOR = gedit

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G54 G90 G94 G97 G7 G64 P0.025
SUBROUTINE_PATH = subroutines
ON_ABORT_COMMAND = O<on_abort> CALL

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = Dino_Evo_sim.hal
HALFILE = custom_sim.hal
HALUI = halui
POSTGUI_HALFILE = probe_basic_postgui_sim.hal

[HALUI]

[TRAJ]
AXES = 2
SPINDLES = 1
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
DEFAULT_VELOCITY = 8.00
MAX_LINEAR_VELOCITY = 202.50
DEFAULT_ACCELERATION = 20.0
MAX_ACCELERATION = 20.0
NO_FORCE_HOMING = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

[AXIS_X]
# SIM: limites de software praticamente desativados (bancada, sem maquina real).
# Valores reais na maquina: MIN -0.5 / MAX 240.0 (ver Dino_Evo.ini).
MIN_LIMIT = -100000.0
MAX_LIMIT = 100000.0
MAX_VELOCITY = 129.375
MAX_ACCELERATION = 2250.0

[JOINT_0]
TYPE = LINEAR
HOME = 5.0
MAX_VELOCITY = 129.375
MAX_ACCELERATION = 2250.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
# SIM: sem limites de software (real: -0.5 / 240.0)
MIN_LIMIT = -100000.0
MAX_LIMIT = 100000.0
FERROR = 10.0
MIN_FERROR = 1.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1

[AXIS_Z]
# SIM: limites de software praticamente desativados (bancada, sem maquina real).
# Valores reais na maquina: MIN -1000.0 / MAX -0.5 (ver Dino_Evo.ini).
MIN_LIMIT = -100000.0
MAX_LIMIT = 100000.0
MAX_VELOCITY = 93.6
MAX_ACCELERATION = 1350.0

[JOINT_1]
TYPE = LINEAR
HOME = -5.0
MAX_VELOCITY = 93.6
MAX_ACCELERATION = 1350.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
# SIM: sem limites de software (real: -1000.0 / -0.5)
MIN_LIMIT = -100000.0
MAX_LIMIT = 100000.0
FERROR = 10.0
MIN_FERROR = 1.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 2
HOME_IS_SHARED = 1

[SPINDLE_0]
P = 0
I = 0
D = 0
FF0 = 1
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 2975
ENCODER_SCALE = 400

[MPG]
SCALE = 0.01
