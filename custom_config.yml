# example of a machine specific settings
windows:
  mainwindow:
    kwargs:
      confirm_exit: false
      ui_file: {{ file.dir }}/probe_basic_custom.ui

application:
  kwargs:
    stylesheet: {{ file.dir }}/probe_basic_custom.qss
    # Barlow Condensed e JetBrains Mono (fonts/). Tem que carregar aqui, na
    # criacao da aplicacao: se carregar depois da janela montada, os widgets
    # ja medidos ficam presos na fonte de reserva (larga) e o texto corta.
    custom_fonts: {{ file.dir }}/fonts

data_plugins:
  tooltable:
    provider: qtpyvcp.plugins.tool_table:ToolTable
    kwargs:
      columns: {{ ini.DISPLAY.tool_table_columns }}

  offsettable:
    provider: qtpyvcp.plugins.offset_table:OffsetTable
    kwargs:
      columns: {{ ini.DISPLAY.offset_columns }}

settings:

  # VTK backplot view settings

  backplot.show-grid:
    default_value: false

  backplot.show-program-bounds:
    default_value: false

  backplot.show-program-labels:
    default_value: false

  backplot.show-program-ticks:
    default_value: false

  backplot.show-machine-bounds:
    default_value: false

  backplot.show-machine-labels:
    default_value: false

  backplot.show-machine-ticks:
    default_value: false

  backplot.perspective-view:
    default_value: false
