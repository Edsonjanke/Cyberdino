[EMC]
VERSION = 1.1
MACHINE = Dino Evo Probe Basic
DEBUG = 0

[DISPLAY]
# Tela cheia: o monitor da maquina e 1920x1080 e a interface e desenhada para
# essa resolucao (a aba GERAR PGM escala os campos pelo tamanho do painel).
DISPLAY = probe_basic_lathe --fullscreen true
BACK_TOOL_LATHE = 1
MASTER_TOOL_OFFSET_MODE = false
CONFIRM_EXIT = False
LOG_FILE = sim.log
LOG_LEVEL = INFO
PREFERENCE_FILE = sim.pref
CONFIG_FILE = custom_config.yml
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
DEFAULT_LINEAR_VELOCITY = 6.000000
MAX_LINEAR_VELOCITY = 75.000000
MIN_LINEAR_VELOCITY = 0.500000
DEFAULT_ANGULAR_VELOCITY = 12.000000
MAX_ANGULAR_VELOCITY = 180.000000
MIN_ANGULAR_VELOCITY = 1.666667
DEFAULT_SPINDLE_SPEED = 300
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.100000
MAX_FEED_OVERRIDE = 2.000000
PROGRAM_PREFIX = /home/evo/linuxcnc/nc_files
OPEN_FILE = /home/evo/linuxcnc/nc_files/pb_examples/blank.ngc
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 3
INCREMENTS = 1mm .1mm .05mm .01mm
USER_BUTTONS_PATH = user_buttons/
USER_TABS_PATH = user_tabs/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XZ
GEOMETRY = XZ
OFFSET_COLUMNS = XZ
TOOL_TABLE_COLUMNS = TXZIJDQR
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true
LATHE = 1
EDITOR = gedit

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G54 G90 G94 G97 G7 G64 P0.025
SUBROUTINE_PATH = subroutines
# M-codes de usuario versionados na config (M101 = incrementa contador de pecas).
# Relativo ao config dir. Protege o M101 do git (antes vivia em nc_files, fora do git).
USER_M_PATH = mcodes
ON_ABORT_COMMAND = O<on_abort> CALL

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HMOT]
CARD0=hm2_7i92.0

[HAL]
HALFILE = Dino_Evo.hal
HALFILE = custom.hal
HALUI = halui
POSTGUI_HALFILE = probe_basic_postgui_fix.hal

[HALUI]

[TRAJ]
AXES = 2
SPINDLES = 1
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
DEFAULT_VELOCITY = 8.00
MAX_LINEAR_VELOCITY = 202.50
DEFAULT_ACCELERATION = 20.0
MAX_ACCELERATION = 20.0
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

